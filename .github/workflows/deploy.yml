name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Clean
        run: flutter clean

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/"

      # IMPORTANT:
      # Verify that Flutter actually generated the files
      # that GitHub Pages needs.
      - name: Verify Web Build
        run: |
          echo "===== build/web ====="
          ls -lah build/web

          echo ""
          echo "===== Required files ====="

          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          test -f build/web/manifest.json
          test -f build/web/main.dart.js

          echo ""
          echo "All required Flutter Web files exist."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4