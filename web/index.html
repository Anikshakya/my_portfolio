  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d14;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #16192b 0%, #0b0d14 100%);
      z-index: 99999;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 40px;
      border-radius: 24px;
      background: rgba(22, 25, 43, 0.65);
      border: 1px solid rgba(168, 85, 247, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(139, 92, 246, 0.15);
      gap: 20px;
      text-align: center;
      max-width: 90vw;
    }

    .avatar-ring-container {
      position: relative;
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #a855f7;
      border-right-color: #6366f1;
      border-bottom-color: #3b82f6;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .avatar-badge {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed 0%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      color: #ffffff;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(124, 58, 237, 0.5);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #d8b4fe 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #c084fc;
      font-weight: 500;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }

    .progress-track {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a855f7, #3b82f6);
      border-radius: 10px;
      animation: shimmer-progress 1.6s ease-in-out infinite alternate;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes shimmer-progress {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }
  </style>
</head>

<body>

  <!-- App-themed Loader Screen -->

      </div>

      </div>

      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>

    </div>
  </div>

  <!-- Flutter Web Entry point -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    (function () {

      function hideLoader() {

        const loading = document.getElementById('loading');

        if (loading && loading.style.opacity !== '0') {

          loading.style.opacity = '0';
          loading.style.pointerEvents = 'none';

          setTimeout(function () {

            if (loading.parentNode) {
              loading.parentNode.removeChild(loading);
            }

          }, 400);
        }
      }

      window.addEventListener(
        'flutter-first-frame',
        hideLoader
      );

      // Safeguard fallback if event fires earlier or stalls
      setTimeout(hideLoader, 8000);

    })();
  </script>
