  <!-- ================================================================

  <style>
    :root {
      --loader-bg: #020208;
      --loader-surface: #16171b;
      --loader-gold: #d2bb6f;
      --loader-muted: #9a9487;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--loader-bg);
      color: #ffffff;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--loader-gold);
      background:
        linear-gradient(
          135deg,
          rgba(210, 187, 111, 0.07),
          transparent 45%
        ),
        var(--loader-bg);
      transition:
        opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        visibility 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-grid {
      position: absolute;
      inset: -30%;
      opacity: 0.12;
      background-image:
        linear-gradient(
          rgba(210, 187, 111, 0.18) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(210, 187, 111, 0.18) 1px,
          transparent 1px
        );
      background-size: 42px 42px;
      transform:
        perspective(500px)
        rotateX(58deg)
        translateY(20%);
      transform-origin: center bottom;
    }

    .loader-content {
      position: relative;
      width: min(320px, calc(100vw - 48px));
      text-align: center;
      font-family:
        Georgia,
        'Times New Roman',
        serif;
    }

    .loader-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(210, 187, 111, 0.7);
      border-radius: 50%;
      box-shadow:
        0 0 28px rgba(210, 187, 111, 0.16);
      animation:
        loader-pulse 1.8s ease-in-out infinite;
    }

    .loader-mark::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--loader-gold);
      box-shadow:
        0 0 18px var(--loader-gold);
    }

    .loader-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.24em;
    }

    .loader-status {
      margin: 10px 0 22px;
      color: var(--loader-muted);
      font: 11px/1.4 monospace;
      letter-spacing: 0.16em;
    }

    .loader-track {
      height: 2px;
      overflow: hidden;
      background:
        rgba(210, 187, 111, 0.16);
    }

    .loader-progress {
      width: 38%;
      height: 100%;
      background: var(--loader-gold);
      box-shadow:
        0 0 12px var(--loader-gold);
      animation:
        loader-progress 1.3s ease-in-out infinite;
    }

    @keyframes loader-pulse {
      0%,
      100% {
        transform: scale(0.94);
        opacity: 0.72;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes loader-progress {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(360%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-mark,
      .loader-progress {
        animation: none;
      }
    }
  </style>

<body>

  <div

       FLUTTER WEB ENTRY POINT
       ================================================================ -->

  <script src="flutter_bootstrap.js" async></script>

  <!-- ================================================================
       HIDE LOADER AFTER FIRST FLUTTER FRAME
       ================================================================ -->

  <script>
    (function () {
      function hideLoader() {
        const loading = document.getElementById('loading');

        if (loading && !loading.classList.contains('is-hidden')) {
          loading.classList.add('is-hidden');

          setTimeout(function () {
            if (loading.parentNode) {
              loading.parentNode.removeChild(loading);
            }
          }, 400);
        }
      }

      window.addEventListener(
        'flutter-first-frame',
        hideLoader
      );

      // Safeguard fallback if event fires earlier or stalls
      setTimeout(hideLoader, 8000);
    })();
  </script>
